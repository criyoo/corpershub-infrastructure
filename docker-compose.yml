# Local host port mappings:
# Postgres 5200 -> 5432
# Valkey 6200 -> 6379
# Django API 8200 -> 8000
# Web 3200 -> 3000
# MinIO 9200 -> 9000
# MinIO Console 9201 -> 9001

name: corpershub

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: corpershub_db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5200:5432"
    networks:
      - corpershub-network

  valkey:
    image: valkey/valkey:9.0-alpine
    environment:
      ALLOW_EMPTY_PASSWORD: yes
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli ping || redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6200:6379"
    networks:
      - corpershub-network

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - minio_data:/data
    networks:
      - corpershub-network

  minio-create-bucket:
    image: quay.io/minio/mc:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing local/corpershub-local-media
        mc anonymous set download local/corpershub-local-media
    networks:
      - corpershub-network

  cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    environment:
      API_ORIGIN_URL: http://api:8000
      CLOUDFLARE_LOG_FILE: /data/cloudflare/cloudflared.log
      CLOUDFLARE_TUNNEL_URL_FILE: /data/cloudflared/tunnel-url
    healthcheck:
      test: [ "CMD-SHELL", "test -s /data/cloudflared/tunnel-url && grep -q '^https://.*\\.trycloudflare\\.com$' /data/cloudflared/tunnel-url && ! grep -q '^https://api\\.trycloudflare\\.com$' /data/cloudflared/tunnel-url" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - cloudflared_data:/data
    networks:
      - corpershub-network

  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
    env_file:
      - ../apps/api/.env.local
    environment:
      SEED_DEMO_ACCOUNTS: "1"
      COLLECTSTATIC_ON_STARTUP: "1"
      DJANGO_SUPERUSER_EMAIL: "admin@corpershub.local"
      DJANGO_SUPERUSER_PASSWORD: "ifG0dbi4mi"
      DJANGO_SUPERUSER_USERNAME: "Admin"
      DJANGO_SUPERUSER_FIRST_NAME: "Admin"
      DJANGO_SUPERUSER_LAST_NAME: "Admin"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py create_superuser && python manage.py seed_demo_data
    volumes:
      - ../apps/api:/app
      - media_files:/app/uploads
    networks:
      - corpershub-network

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../apps/api/.env.local
    entrypoint:
      - /app/docker.cloudflare.sh
    environment:
      BYPASS_VERIFICATION: 1
      SEED_DEMO_ACCOUNTS: True
      HOME: /tmp
      CLOUDFLARE_TUNNEL_URL_FILE: /data/cloudflared/tunnel-url
      FLUTTERWAVE_WEBHOOK_PATH: /api/payments/webhooks/flutterwave/
      CLOUDFLARE_WAIT_ATTEMPTS: "10"
    depends_on:
      cloudflared:
        condition: service_started
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-create-bucket:
        condition: service_completed_successfully
    volumes:
      - ../apps/api:/app
      - media_files:/app/media
      - cloudflared_data:/data:ro
    working_dir: /app
    command: sh scripts/dev-entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8200:8000"
    networks:
      - corpershub-network

  worker:
    build:
      context: ../apps/api
    env_file:
      - ../apps/api/.env.local
    environment:
      SEED_DEMO_ACCOUNTS: True
      HOME: /tmp
      POSTGRES_DB: corpershub_db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9200
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ../apps/api:/app
      - media_files:/app/media
    command: celery -A config worker -l info
    networks:
      - corpershub-network

  web:
    build:
      context: ../apps/web
      target: dev
    env_file:
      - ../apps/web/.env.local
    environment:
      PORT: 3000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8200/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8200
      NEXT_PUBLIC_HOME_BACKGROUNDS_MANIFEST_URL: http://localhost:8200/api/home-backgrounds/
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3200:3000"
    networks:
      - corpershub-network

volumes:
  postgres_data:
  minio_data:
  media_files:
  cloudflared_data:

networks:
  corpershub-network:
    driver: bridge
